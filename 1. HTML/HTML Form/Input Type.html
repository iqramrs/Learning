<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form.css">
    <title>Input Type</title>
</head>
<body>
    <h1>Input Type</h1>

    <!-- text -->
    <form action="/form" method="post" method="post">
        <label for="text">Text</label>
        <input type="text" id="text" value="Admin123">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- email -->
    <form action="/form" method="post" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" value="admin@gmail.com">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Password -->
    <form action="/form" method="post" method="post">
        <label for="pass">Password</label>
        <input type="password" id="pass" value="admin123">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Number -->
    <form action="/form" method="post" method="post">
        <label for="num">Number</label>
        <input type="number" id="num" value="123456">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Image -->
    <form action="/form" method="get" method="post">
        <label for="Image">Image</label>
        <input type="image" id="Image">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Color -->
    <form action="/form" method="get" method="post">
        <label for="Color">Color</label>
        <input type="color" id="Color">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- File -->
    <form action="/form" method="get" method="post">
        <label for="file">File</label>
        <input type="file" id="file">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- date -->
    <form action="/form" method="get">
        <label for="date">Date</label>
        <input type="date" id="date">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Week -->
    <form action="/form" method="get">
        <label for="week">Week</label>
        <input type="week" id="week">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Month -->
    <form action="/form" method="get">
        <label for="Month">Month</label>
        <input type="month" id="month">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Time -->
    <form action="/form" method="get">
        <label for="time">Time</label>
        <input type="time" id="time">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Search -->
    <form action="/form" method="get">
        <label for="search">Search</label>
        <input type="search" id="search" value="Cuaca hari ini">
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Checkbox -->
    <form action="/form" method="get">
        <p>
            <label for="">Sesuai Pesanan?</label>
        </p>
        <input type="checkbox" name="term" id="term" value="True" checked><label for="">Ya</label>
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Radio -->
    <form action="/form" method="get">
        <input type="radio" id="" name="radio" checked><label for="">Radio</label>
        <input type="radio" id="" name="radio"><label for="">Radio</label>
        <input type="radio" id="" name="radio" disabled><label for="">Radio</label>
        <input type="radio" id="" name="radio"><label for="">Radio</label>
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Select -->
    <form action="/form" method="get">
        <label for="">Pilih Makanan</label>
        <select name="Makan" id="Makan">
            <option value="">--Pilih Salah Satu--</option>
            <option value="Pizza">Pizza</option>
            <option value="Nasi">Nasi</option>
            <option value="Dimsum">Dimsum</option>
        </select>
        <button type="submit">Submit</button>
    </form>
    <br>
    <!-- Reset -->
    <form action="/form" method="get">
        <label for="reset">Reset button</label>
        <input type="reset" id="reset">
    </form>
    <br>
    <!-- Range -->
    <form action="/form" method="get">
        <label for="range">Range</label>
        <input type="range" id="range">
        <button type="submit">Submit</button>
    </form>
    <!-- Text Area -->
    <form action="/form" method="get">
        <p>
            <label for="notes">Catatan</label>
        </p>
        <textarea name="notes" id="notes" cols="50" rows="5"></textarea>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
