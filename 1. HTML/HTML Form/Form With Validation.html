<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form With Validation.css">
    <title>Formulir</title>
</head>
<body>
    
    <!-- 
    required untuk  mengisi field yang harus diisi
    minlength untuk  memastikan bahwa inputan harus memiliki panjang minimal karakter
    maxlength untuk  memastikan bahwa inputan harus memiliki panjang maksimal karakter
    min untuk memastikan bahwa inputan harus memiliki nilai minimal
    max untuk memastikan bahwa inputan harus memiliki nilai maksimal -->

    <h1>Form</h1>
    <form action="Valid" method="post">
        <label for="nama">Nama</label>
        <input type="text" name="nama" required minlength="4" maxlength="15">
        <label for="pass">Password</label>
        <input type="password" name="pass" required minlength="3" maxlength="10">
        <label for="jumlah">Jumlah Barang</label>
        <input type="number" name="jumlah" id="jumlah" min="1" max="5">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
